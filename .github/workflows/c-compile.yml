name: c-compile

# Compile and link the Linux/PortMaster target. `ct` never links against the
# game's own libraries (it loads libchrono.so / libc++_shared.so itself at run
# time), so a full link works here with only distro dev packages. Each unit is
# compiled to a .o -- catching header breakage and #ifdef regressions on the
# `#else` (non-Switch) branches -- and then both variants are linked: the real
# one with source/movie_player.c and the boot-to-title one with
# portmaster/movie_stub.c, so an entry point missing from either is caught. The
# Switch `#ifdef __SWITCH__` branches are built/verified in the sibling ct_nx
# repo. movie_player.c uses the FFmpeg 5.1+ channel-layout API, so it builds
# against Ubuntu 24.04's ffmpeg 6.x here (not 22.04's 4.4); the released binary
# is still built in the PortMaster builder image with its pinned ffmpeg 7.1.

on:
  push:
    paths:
      - 'source/**'
      - 'portmaster/**'
      - '.github/workflows/c-compile.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'portmaster/**'
      - '.github/workflows/c-compile.yml'

jobs:
  linux-target:
    # aarch64 runner: the code is aarch64-specific (-mcpu=cortex-a53, the
    # crash handler reads uc_mcontext.regs[30], etc.). Free arm64 runners are
    # available for public repos.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libsdl2-dev libfreetype-dev \
            libgles-dev libegl-dev libgl-dev \
            libavformat-dev libavcodec-dev libswscale-dev \
            libswresample-dev libavutil-dev

      - name: Compile Linux target
        run: |
          set -euo pipefail
          CF="-O2 -g -mcpu=cortex-a53 -Iportmaster -Isource \
              $(sdl2-config --cflags) $(pkg-config --cflags freetype2)"

          # Every Linux-target unit. movie_player.c (real FMV) and movie_stub.c
          # (boot-to-title placeholder) both define movie_play, but each compiles
          # to its own .o and they are never linked together here, so both are
          # syntax-checked.
          SRC="portmaster/os_linux.c portmaster/compat_libc.c portmaster/osk.c \
               portmaster/crash.c portmaster/movie_stub.c \
               source/asset.c source/config.c source/error.c source/gfx.c \
               source/imports.c source/jni_fake.c source/libc_shim.c \
               source/main.c source/movelog.c source/movie_player.c \
               source/opensles.c source/prefs.c source/rescale.c \
               source/shadercache.c source/so_util.c source/util.c"

          mkdir -p build
          rc=0
          for f in $SRC; do
            echo ">> cc $f"
            # shellcheck disable=SC2086
            gcc $CF -c "$f" -o "build/$(basename "$f").o" || rc=1
          done
          exit $rc

      - name: Link both variants
        run: |
          set -euo pipefail
          LIBS="$(sdl2-config --libs) $(pkg-config --libs freetype2) \
                -lGLESv2 -lEGL -lpthread -lm -ldl"
          FF="$(pkg-config --libs libavformat libavcodec libswscale libswresample libavutil)"
          COMMON="$(ls build/*.o | grep -v -e '/movie_stub\.c\.o$' -e '/movie_player\.c\.o$')"
          echo ">> link ct (real FMV player)"
          # shellcheck disable=SC2086
          gcc $COMMON build/movie_player.c.o $LIBS $FF -o build/ct
          echo ">> link ct-nofmv (movie_stub.c)"
          # shellcheck disable=SC2086
          gcc $COMMON build/movie_stub.c.o $LIBS -o build/ct-nofmv
